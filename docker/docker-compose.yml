name: dockerforge

services:
  postgres:
    image: postgres:16
    container_name: dockerforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dockerforge}
      POSTGRES_USER: ${POSTGRES_USER:-dockerforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dockerforge}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dockerforge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Message Broker
  redis:
    image: redis:7-alpine
    container_name: dockerforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: dockerforge-migrate
    env_file:
      - ../backend/.env
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Backend
  dockerforge-api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: dockerforge-api
    restart: unless-stopped
    env_file:
      - ../backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "7000:8000"
    volumes:
      - project_data:/app/data/projects
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: dockerforge-worker
    restart: unless-stopped
    env_file:
      - ../backend/.env
    command: arq app.worker.WorkerSettings
    volumes:
      - project_data:/app/data/projects
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  project_data:
