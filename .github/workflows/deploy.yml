name: Deploy to Droplet

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # --- Secrets ---
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          # --- Variables ---
          DOMAIN: ${{ vars.DOMAIN }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          DB_USER: ${{ vars.DB_USER }}
          DB_NAME: ${{ vars.DB_NAME }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          DEBUG: ${{ vars.DEBUG }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          envs: DB_PASSWORD,JWT_SECRET_KEY,DOMAIN,CORS_ORIGINS,DB_USER,DB_NAME,ENVIRONMENT,DEBUG
          script: |
            set -e
            cd /opt/dockerforge
            git fetch --all
            git reset --hard origin/main

            cat > backend/.env <<EOF
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            DB_HOST=postgres
            DB_PORT=5432
            DB_NAME=${DB_NAME}

            JWT_SECRET_KEY=${JWT_SECRET_KEY}
            JWT_ALGORITHM=HS256
            JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
            JWT_REFRESH_TOKEN_EXPIRE_DAYS=7

            ARQ_JOB_TIMEOUT_SECONDS=7200
            BUILD_MAX_CONCURRENT=2

            MAX_UPLOAD_SIZE_MB=100
            PROJECTS_SOURCE_DIR=/var/lib/dockerforge/projects

            CORS_ORIGINS=${CORS_ORIGINS}

            HOST=0.0.0.0
            PORT=8000
            DEBUG=${DEBUG}
            ENVIRONMENT=${ENVIRONMENT}
            EOF

            # Compose-level interpolation: Postgres init creds (must match the app's
            # DB_* values) and the Caddy domain.
            export POSTGRES_DB="${DB_NAME}" POSTGRES_USER="${DB_USER}" POSTGRES_PASSWORD="${DB_PASSWORD}" DOMAIN="${DOMAIN}"

            docker compose -f docker/docker-compose.yml up -d --build --remove-orphans
            docker image prune -f
            docker compose -f docker/docker-compose.yml ps
